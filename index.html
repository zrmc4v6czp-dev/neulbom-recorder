<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174f78">
  <title>늘봄 진료 녹음</title>
  <style>
    :root{font-family:Arial,'Noto Sans KR',sans-serif;color:#1f2933;background:#edf1f4}
    *{box-sizing:border-box}body{margin:0;padding:16px;font-size:19px;line-height:1.5}
    main{max-width:620px;margin:0 auto;background:#fff;border:1px solid #cbd2d9;border-radius:22px;padding:22px}
    h1{font-size:28px;color:#163e5a;margin:0 0 8px}p{margin:8px 0;color:#52606d}
    .notice{background:#fff3d6;border:1px solid #e5c66a;border-radius:14px;padding:13px;margin:16px 0;font-size:16px}
    .check{display:flex;gap:12px;align-items:flex-start;margin:18px 0;font-size:17px}.check input{width:24px;height:24px;flex:none;margin-top:3px}
    button{width:100%;border:0;border-radius:14px;min-height:60px;padding:14px 18px;font-size:20px;font-weight:700;background:#174f78;color:white;margin-top:10px}
    button.secondary{background:#e5ebf0;color:#182b3a;border:1px solid #b9c5cf}button:disabled{opacity:.5}
    .status{background:#f1f5f8;border-radius:12px;padding:14px;margin-top:14px;min-height:54px;font-weight:700;color:#174f78;white-space:pre-wrap}
    .timer{text-align:center;font-size:38px;font-weight:800;color:#174f78;margin:20px 0}
    audio{width:100%;margin-top:12px}.small{font-size:14px;color:#667784}
  </style>
</head>
<body>
<main>
  <h1>늘봄 진료 녹음</h1>
  <p>진료 설명을 녹음한 뒤 원래 앱으로 자동 전달합니다.</p>
  <div class="notice"><strong>녹음 전 확인</strong><br>환자와 의료진에게 녹음 사실을 알리고 필요한 동의와 병원 규정을 확인해야 합니다. 동의 없이 녹음하거나 녹음 파일을 제3자에게 공유하지 마세요. 이 시제품에는 실제 환자정보를 사용하지 마세요.</div>
  <label class="check"><input id="confirmConsent" type="checkbox"><span>녹음에 필요한 동의와 병원 규정을 확인했습니다.</span></label>
  <div id="timer" class="timer">00:00</div>
  <button id="startBtn" type="button">녹음 시작</button>
  <button id="stopBtn" class="secondary" type="button" disabled>녹음 중지 및 앱으로 보내기</button>
  <div id="status" class="status" role="status">녹음 전입니다. 최대 4분까지 녹음할 수 있습니다.</div>
  <audio id="preview" controls hidden></audio>
  <p class="small">녹음은 최대 4분이며, 16kHz 모노 WAV로 변환해 AI 요약 앱에 전달합니다.</p>
</main>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const parentOrigin = params.get('parentOrigin') || '';
const $ = id => document.getElementById(id);
let mediaRecorder=null, mediaStream=null, chunks=[], seconds=0, ticker=null, previewUrl='';
let sessionActive=false;

function validParentOrigin(value){
  try{
    const u=new URL(value);
    return u.protocol==='https:' && (u.hostname==='script.google.com' || u.hostname.endsWith('.googleusercontent.com'));
  }catch(e){return false;}
}
function sendToParent(type, extra={}){
  if(!window.opener || window.opener.closed) return false;
  window.opener.postMessage(Object.assign({type,token},extra),parentOrigin);
  return true;
}
function status(text,isError=false){$('status').textContent=text;$('status').style.color=isError?'#9b2c2c':'#174f78';}
function timeText(value){return String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0');}
function chooseMimeType(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  const candidates=['audio/webm;codecs=opus','audio/mp4','audio/webm'];
  return candidates.find(t=>MediaRecorder.isTypeSupported(t)) || '';
}

async function beginRecording(){
  if(!token || !validParentOrigin(parentOrigin)){
    status('앱에서 정상적으로 녹음 창을 열어 주세요. 주소를 직접 입력해 실행할 수 없습니다.',true);
    $('startBtn').disabled=true;return;
  }
  if(!$('confirmConsent').checked){status('먼저 녹음 동의 및 병원 규정 확인란을 선택해 주세요.',true);return;}
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    status('현재 브라우저가 녹음을 지원하지 않습니다. 최신 Chrome 또는 Safari에서 다시 열어 주세요.',true);return;
  }
  $('startBtn').disabled=true;
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
    chunks=[];seconds=0;$('timer').textContent='00:00';
    const mimeType=chooseMimeType();
    mediaRecorder=mimeType?new MediaRecorder(mediaStream,{mimeType}):new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable=e=>{if(e.data && e.data.size) chunks.push(e.data);};
    mediaRecorder.onerror=e=>{status('녹음 오류: '+(e.error?.message || '브라우저 녹음 오류'),true);};
    mediaRecorder.onstop=finishRecording;
    mediaRecorder.start(1000);
    sessionActive=true;$('stopBtn').disabled=false;
    status('녹음 중입니다. 완료하면 아래 중지 버튼을 눌러 주세요.');
    sendToParent('NEULBOM_RECORDING_STARTED');
    ticker=setInterval(()=>{
      seconds++;$('timer').textContent=timeText(seconds);
      if(seconds>=240 && mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    },1000);
  }catch(e){
    if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
    $('startBtn').disabled=false;
    let message=e.message || String(e);
    if(e.name==='NotAllowedError' || e.name==='PermissionDeniedError') message='마이크 권한이 거부되었습니다. 브라우저 주소창의 사이트 설정에서 마이크를 허용한 뒤 새로고침해 주세요.';
    else if(e.name==='NotFoundError') message='마이크를 찾을 수 없습니다. 기기의 마이크 연결을 확인해 주세요.';
    else if(e.name==='NotReadableError') message='마이크를 다른 앱이 사용 중일 수 있습니다. 다른 통화·녹음 앱을 닫고 다시 시도해 주세요.';
    status(message,true);sendToParent('NEULBOM_RECORDING_ERROR',{message});
  }
}

async function finishRecording(){
  clearInterval(ticker);ticker=null;
  if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
  $('stopBtn').disabled=true;$('startBtn').disabled=false;
  if(!chunks.length){status('녹음 데이터가 없습니다. 다시 시도해 주세요.',true);sessionActive=false;return;}
  status('녹음 파일을 처리하고 원래 앱으로 전달하고 있습니다.');
  try{
    const mime=(mediaRecorder && mediaRecorder.mimeType) || (chunks[0] && chunks[0].type) || 'audio/webm';
    const sourceBlob=new Blob(chunks,{type:mime});
    const wavBlob=await convertToWav(sourceBlob);
    if(wavBlob.size>10*1024*1024) throw new Error('파일이 10MB를 초과했습니다. 녹음 시간을 줄여 다시 시도해 주세요.');
    if(previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl=URL.createObjectURL(wavBlob);$('preview').src=previewUrl;$('preview').hidden=false;
    const base64=await blobToBase64(wavBlob);
    if(base64.length>14*1024*1024) throw new Error('전송 파일이 너무 큽니다. 녹음 시간을 줄여 주세요.');
    if(!sendToParent('NEULBOM_AUDIO_READY',{base64,seconds})) throw new Error('원래 앱 창과 연결되지 않았습니다. 원래 앱에서 녹음 버튼을 다시 눌러 주세요.');
    status('녹음 파일을 원래 앱으로 보냈습니다. 원래 앱 창으로 돌아가 AI 분석 및 요약 버튼을 눌러 주세요.');
    sessionActive=false;
  }catch(e){
    status(e.message || '녹음 파일을 전달하지 못했습니다.',true);
    sendToParent('NEULBOM_RECORDING_ERROR',{message:e.message || '녹음 파일 전달 실패'});
  }
}

function stopRecording(){if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();}
function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob);});}
async function convertToWav(blob){
  const arrayBuffer=await blob.arrayBuffer();
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx) throw new Error('이 브라우저는 오디오 변환을 지원하지 않습니다.');
  const ctx=new AudioCtx();
  try{
    const audio=await ctx.decodeAudioData(arrayBuffer.slice(0));
    const channels=[];
    for(let c=0;c<audio.numberOfChannels;c++) channels.push(audio.getChannelData(c));
    const targetRate=16000, ratio=audio.sampleRate/targetRate;
    const length=Math.floor(audio.length/ratio), samples=new Float32Array(length);
    for(let i=0;i<length;i++){
      const pos=i*ratio, idx=Math.floor(pos), frac=pos-idx;
      let value=0;
      for(let c=0;c<channels.length;c++){
        const ch=channels[c];
        const a=ch[idx] || 0, b=ch[Math.min(idx+1,ch.length-1)] || 0;
        value+=(a*(1-frac)+b*frac)/channels.length;
      }
      samples[i]=value;
    }
    const buffer=new ArrayBuffer(44+samples.length*2), view=new DataView(buffer);
    writeStr(view,0,'RIFF');view.setUint32(4,36+samples.length*2,true);writeStr(view,8,'WAVE');
    writeStr(view,12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
    view.setUint32(24,targetRate,true);view.setUint32(28,targetRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
    writeStr(view,36,'data');view.setUint32(40,samples.length*2,true);
    let offset=44;
    for(let i=0;i<samples.length;i++){
      const s=Math.max(-1,Math.min(1,samples[i]));view.setInt16(offset,s<0?s*0x8000:s*0x7fff,true);offset+=2;
    }
    return new Blob([buffer],{type:'audio/wav'});
  }finally{await ctx.close();}
}
function writeStr(view,offset,str){for(let i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i));}

$('startBtn').addEventListener('click',beginRecording);
$('stopBtn').addEventListener('click',stopRecording);
if(!token || !validParentOrigin(parentOrigin)){
  status('앱에서 정상적으로 녹음 창을 열어 주세요. 주소를 직접 입력해 실행할 수 없습니다.',true);
  $('startBtn').disabled=true;
}else{
  sendToParent('NEULBOM_RECORDER_READY');
}
window.addEventListener('beforeunload',()=>{if(sessionActive && mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();});
</script>
</body>
</html>
